<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>할로윈 방탈출: 어둠 속의 랜턴 (Mobile Touch Fix)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        background-color: #030206;
        color: #e2e2e9;
        font-family:
          "Malgun Gothic",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        position: fixed; /* 모바일 바운스 스크롤 방지 */
      }
      #game-container {
        position: relative;
        width: 100%;
        max-width: 960px;
        height: 100vh;
        max-height: 680px;
        border: 2px solid #331c42;
        box-shadow: 0 0 40px rgba(110, 20, 160, 0.4);
        overflow: hidden;
        background: #000;
        touch-action: none; /* 터치 스크롤 및 확대 원천 차단 */
      }

      /* 으스스한 배경 연출 */
      .room-bg {
        position: absolute;
        width: 100%;
        height: 100%;
        background-image:
          radial-gradient(
            circle,
            rgba(15, 10, 25, 0.3) 0%,
            rgba(3, 2, 6, 0.95) 100%
          ),
          url("https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1200&auto=format&fit=crop");
        background-size: cover;
        background-position: center;
        filter: contrast(125%) brightness(75%);
      }

      /* 시각적 이모지 오브젝트 */
      .room-object {
        position: absolute;
        pointer-events: none;
        filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.9));
        z-index: 2;
      }

      /* 16개 조사 포인트 (반응형 퍼센트 위치) */
      .inspect-point {
        position: absolute;
        border: 1px dashed rgba(255, 153, 0, 0.25);
        background: rgba(255, 153, 0, 0.05);
        border-radius: 6px;
        z-index: 5;
        cursor: pointer;
      }
      .inspect-point:active {
        background: rgba(255, 153, 0, 0.4);
        border-color: rgba(255, 215, 0, 1);
      }

      #flashlight-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }

      /* UI 구성 레이어 */
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 10px;
      }
      .top-bar,
      .bottom-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(10, 8, 16, 0.92);
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #4a2f60;
        pointer-events: auto;
        backdrop-filter: blur(5px);
      }
      .stat-group {
        display: flex;
        gap: 12px;
        font-size: 13px;
        font-weight: bold;
        align-items: center;
      }
      .battery-bar-container {
        width: 80px;
        height: 12px;
        background: #181520;
        border: 1px solid #5d3d75;
        border-radius: 3px;
        overflow: hidden;
        display: inline-block;
        vertical-align: middle;
        margin-left: 4px;
      }
      #battery-fill {
        width: 100%;
        height: 100%;
        background: #4caf50;
        transition: width 0.3s;
      }

      .inventory-container {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .inventory {
        display: flex;
        gap: 6px;
      }
      .inv-slot {
        width: 44px;
        height: 44px;
        background: #14101d;
        border: 1px solid #48345c;
        border-radius: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        cursor: pointer;
      }
      .inv-slot.has-item {
        border-color: #ff9800;
        background: #2a1c0e;
      }
      .inv-slot.selected {
        border-color: #00e676;
        box-shadow: 0 0 10px rgba(0, 230, 118, 0.7);
        background: #16301e;
      }

      /* 화면 팝업 모달 */
      .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(4, 3, 7, 0.96);
        z-index: 100;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        pointer-events: auto;
      }
      .screen h1 {
        font-size: 28px;
        color: #ff5722;
        margin-bottom: 12px;
        text-shadow: 0 0 12px rgba(255, 87, 34, 0.6);
      }
      .screen p {
        color: #b3b3c6;
        margin-bottom: 20px;
        line-height: 1.5;
        max-width: 500px;
        font-size: 14px;
      }
      .btn {
        background: #6a1b9a;
        color: white;
        border: none;
        padding: 10px 22px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn:active {
        background: #8e24aa;
      }

      /* 금고 모달 */
      #safe-modal {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 290px;
        background: #120e1a;
        border: 2px solid #ff5722;
        border-radius: 8px;
        padding: 16px;
        z-index: 80;
        display: none;
        text-align: center;
        box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
        pointer-events: auto;
      }
      #safe-display {
        width: 100%;
        height: 40px;
        background: #000;
        border: 1px solid #54396d;
        color: #ff5722;
        font-size: 24px;
        letter-spacing: 6px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 12px;
        font-family: monospace;
      }
      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .keypad button {
        padding: 14px;
        background: #20192e;
        color: white;
        border: 1px solid #48345c;
        font-size: 18px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
      }

      #message-box {
        position: absolute;
        bottom: 75px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(10, 8, 16, 0.95);
        border: 1px solid #ff9800;
        color: #ffe0b2;
        padding: 10px 18px;
        border-radius: 6px;
        font-size: 13px;
        z-index: 25;
        display: none;
        pointer-events: none;
        width: 90%;
        max-width: 500px;
        text-align: center;
      }

      #jumpscare-flash {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #8b0000;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.1s;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>

    <script>
      let gameState = "START";
      let startTime = 0;
      let timerInterval = null;
      let battery = 100;
      let inventory = [];
      let selectedSlots = [];
      let items = {};
      let safePassword = "0000";
      let safeInput = "";
      let isUvActive = false;
      let isDrawerUnlocked = false;
      let isClockFixed = false;
      let lightX = 200,
        lightY = 200;
      let canvas, ctx;

      const ITEMS = {
        BATTERY: {
          id: "BATTERY",
          name: "건전지",
          icon: "🔋",
          desc: "랜턴 배터리 +40% 충전",
        },
        RUSTY_KEY: {
          id: "RUSTY_KEY",
          name: "녹슨 열쇠",
          icon: "🗝️",
          desc: "낡은 서랍장을 열 수 있는 열쇠",
        },
        HAMMER_HEAD: {
          id: "HAMMER_HEAD",
          name: "망치 머리",
          icon: "🔨",
          desc: "나무 자루와 결합할 머리",
        },
        WOOD_HANDLE: {
          id: "WOOD_HANDLE",
          name: "나무 자루",
          icon: "🪵",
          desc: "망치 머리와 결합할 자루",
        },
        FULL_HAMMER: {
          id: "FULL_HAMMER",
          name: "완성된 망치",
          icon: "⚒️",
          desc: "해골 소품을 부수는 망치",
        },
        UV_FILTER: {
          id: "UV_FILTER",
          name: "UV 필터",
          icon: "💜",
          desc: "자외선 모드로 형광 암호 확인",
        },
        CLOCK_HAND: {
          id: "CLOCK_HAND",
          name: "시계 바늘",
          icon: "🧭",
          desc: "쾌종시계용 바늘",
        },
        KEY_PART_A: {
          id: "KEY_PART_A",
          name: "마스터키 (상)",
          icon: "🧩",
          desc: "파손된 키의 상단 조각",
        },
        KEY_PART_B: {
          id: "KEY_PART_B",
          name: "마스터키 (하)",
          icon: "🧩",
          desc: "파손된 키의 하단 조각",
        },
        MASTER_KEY: {
          id: "MASTER_KEY",
          name: "완성된 마스터키",
          icon: "🚪",
          desc: "현관문을 열 수 있는 마스터키",
        },
      };

      let audioCtx = null;
      function initAudio() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      function playSound(type) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === "click") {
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === "item") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.2);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === "jumpscare") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(120, now);
          osc.frequency.linearRampToValueAtTime(650, now + 0.35);
          gain.gain.setValueAtTime(0.65, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      }

      const container = document.getElementById("game-container");

      // ★ 모바일 터치 및 마우스 드래그 좌표 실시간 연동 강화 ★
      function updateCoordinates(e) {
        const rect = container.getBoundingClientRect();
        let clientX, clientY;

        if (e.touches && e.touches.length > 0) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        if (clientX !== undefined && clientY !== undefined) {
          lightX = clientX - rect.left;
          lightY = clientY - rect.top;
        }
      }

      container.addEventListener("mousemove", updateCoordinates, {
        passive: true,
      });
      container.addEventListener("touchstart", updateCoordinates, {
        passive: true,
      });
      // passive: false를 주어야 모바일 기본 스크롤 에러 없이 랜턴 드래그가 매끄럽게 작동합니다.
      container.addEventListener(
        "touchmove",
        (e) => {
          updateCoordinates(e);
          e.preventDefault();
        },
        { passive: false },
      );

      function setupCanvas() {
        canvas = document.getElementById("flashlight-canvas");
        ctx = canvas.getContext("2d");
        resizeCanvas();
        requestAnimationFrame(updateFlashlight);
      }

      function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        lightX = canvas.width / 2;
        lightY = canvas.height / 2;
      }

      function updateFlashlight() {
        if (gameState === "PLAYING") {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "rgba(3, 2, 6, 0.96)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          let radius =
            canvas.width * 0.13 + (battery / 100) * (canvas.width * 0.08);
          ctx.globalCompositeOperation = "destination-out";

          let gradient = ctx.createRadialGradient(
            lightX,
            lightY,
            radius * 0.15,
            lightX,
            lightY,
            radius,
          );
          gradient.addColorStop(0, "rgba(0, 0, 0, 1)");
          gradient.addColorStop(0.75, "rgba(0, 0, 0, 0.85)");
          gradient.addColorStop(1, "rgba(0, 0, 0, 0)");

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(lightX, lightY, radius, 0, Math.PI * 2);
          ctx.fill();

          ctx.globalCompositeOperation = "source-over";

          // UV 자외선 네온 암호 연출
          if (isUvActive) {
            ctx.fillStyle = "rgba(168, 85, 247, 0.25)";
            ctx.beginPath();
            ctx.arc(lightX, lightY, radius, 0, Math.PI * 2);
            ctx.fill();

            let wallX = canvas.width * 0.4;
            let wallY = canvas.height * 0.23;
            let wallW = canvas.width * 0.2;
            let wallH = canvas.height * 0.16;

            if (
              lightX >= wallX &&
              lightX <= wallX + wallW &&
              lightY >= wallY &&
              lightY <= wallY + wallH
            ) {
              let fontSize = Math.max(22, Math.floor(canvas.width * 0.045));
              ctx.font = `bold ${fontSize}px monospace`;
              ctx.fillStyle = "#00ff66";
              ctx.shadowColor = "#00ff66";
              ctx.shadowBlur = 15;
              ctx.fillText(
                safePassword,
                canvas.width * 0.43,
                canvas.height * 0.32,
              );
              ctx.shadowBlur = 0;
            }
          }

          battery -= 0.035;
          if (battery <= 0) {
            battery = 0;
            triggerJumpscare();
            showMsg("배터리가 끊겨 어둠 속에 갇혔습니다...");
            resetGame();
          }

          document.getElementById("battery-fill").style.width = battery + "%";
          document.getElementById("battery-fill").style.background =
            battery < 30 ? "#f44336" : "#4caf50";
        }
        requestAnimationFrame(updateFlashlight);
      }

      function startGame() {
        initAudio();
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("win-screen").classList.add("hidden");

        gameState = "PLAYING";
        battery = 100;
        inventory = [];
        selectedSlots = [];
        isUvActive = false;
        isDrawerUnlocked = false;
        isClockFixed = false;
        document.getElementById("uv-status").style.display = "none";
        updateInventoryUI();

        lightX = container.clientWidth / 2;
        lightY = container.clientHeight / 2;

        safePassword = Math.floor(1000 + Math.random() * 9000).toString();

        startTime = performance.now();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          let elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
          document.getElementById("timer-display").innerText = elapsed + "초";
        }, 50);

        const allPoints = [
          "painting",
          "bookshelf",
          "bed",
          "carpet",
          "mirror",
          "vent",
          "chair",
          "box",
          "shoes",
          "candle",
        ];
        let shuffled = allPoints.sort(() => 0.5 - Math.random());

        items = {
          [shuffled[0]]: ITEMS.RUSTY_KEY,
          [shuffled[1]]: ITEMS.WOOD_HANDLE,
          [shuffled[2]]: ITEMS.CLOCK_HAND,
          [shuffled[3]]: ITEMS.BATTERY,
          [shuffled[4]]: ITEMS.BATTERY,
        };
      }

      function inspectPoint(pointId) {
        if (gameState !== "PLAYING") return;
        playSound("click");

        if (pointId === "desk") {
          if (!isDrawerUnlocked) {
            let keyIdx = inventory.findIndex((item) => item.id === "RUSTY_KEY");
            if (keyIdx !== -1) {
              isDrawerUnlocked = true;
              inventory.splice(keyIdx, 1);
              inventory.push(ITEMS.HAMMER_HEAD);
              updateInventoryUI();
              showMsg("🔑 녹슨 열쇠로 서랍 개봉! [망치 머리] 획득!");
              playSound("item");
            } else {
              showMsg("서랍장이 잠겨있습니다. 열쇠가 필요합니다.");
            }
          } else {
            showMsg("서랍장은 비어있습니다.");
          }
          return;
        }

        if (pointId === "skull") {
          let hammerIdx = inventory.findIndex(
            (item) => item.id === "FULL_HAMMER",
          );
          if (hammerIdx !== -1) {
            if (items["skull"] !== null) {
              items["skull"] = null;
              inventory.push(ITEMS.UV_FILTER);
              inventory.push(ITEMS.BATTERY);
              updateInventoryUI();
              showMsg("💥 망치로 해골 파괴! [UV 필터] & [건전지] 획득!");
              playSound("item");
            } else {
              showMsg("깨진 해골 조각만 남아있습니다.");
            }
          } else {
            showMsg("단단한 해골 소품입니다. 망치가 필요합니다.");
          }
          return;
        }

        if (pointId === "wall") {
          if (isUvActive)
            showMsg(`💜 UV 보랏빛 형광 암호: [ ${safePassword} ]`);
          else showMsg("핏자국 벽면입니다. 자외선(UV) 모드로 비춰보세요.");
          return;
        }

        if (pointId === "clock") {
          if (!isClockFixed) {
            let handIdx = inventory.findIndex(
              (item) => item.id === "CLOCK_HAND",
            );
            if (handIdx !== -1) {
              isClockFixed = true;
              inventory.splice(handIdx, 1);
              inventory.push(ITEMS.KEY_PART_B);
              updateInventoryUI();
              showMsg("🕰️ 시계 바늘 장착! [마스터키 (하)] 조각 획득!");
              playSound("item");
            } else {
              showMsg("시계 바늘이 빠져있습니다.");
            }
          } else {
            showMsg("시계가 정상 동작 중입니다.");
          }
          return;
        }

        if (pointId === "safe") {
          if (items["safe_cleared"]) showMsg("금고는 열려있습니다.");
          else openSafeModal();
          return;
        }

        if (pointId === "door") {
          let masterKeyIdx = inventory.findIndex(
            (item) => item.id === "MASTER_KEY",
          );
          if (masterKeyIdx !== -1) clearGame();
          else showMsg("🔒 현관문입니다. [완성된 마스터키]가 필요합니다.");
          return;
        }

        let found = items[pointId];
        if (found) {
          if (inventory.length < 4) {
            inventory.push(found);
            items[pointId] = null;
            updateInventoryUI();
            showMsg(`조사 성공: [${found.name}] 획득!`);
            playSound("item");
          } else showMsg("소지품 칸이 가득 찼습니다!");
        } else {
          showMsg("아무것도 없습니다...");
          triggerJumpScareChance();
        }
      }

      function clickSlot(idx) {
        let item = inventory[idx];
        if (!item) return;

        if (item.id === "BATTERY") {
          battery = Math.min(100, battery + 40);
          inventory.splice(idx, 1);
          updateInventoryUI();
          showMsg("🔋 랜턴 충전 완료 (+40%)");
          playSound("item");
          return;
        }

        if (item.id === "UV_FILTER") {
          isUvActive = !isUvActive;
          document.getElementById("uv-status").style.display = isUvActive
            ? "inline"
            : "none";
          showMsg(
            isUvActive
              ? "💜 UV 필터 장착! (벽면을 비춰보세요)"
              : "💡 일반 모드 전환",
          );
          playSound("click");
          return;
        }

        let selIndex = selectedSlots.indexOf(idx);
        if (selIndex !== -1) selectedSlots.splice(selIndex, 1);
        else if (selectedSlots.length < 2) selectedSlots.push(idx);
        updateInventoryUI();
      }

      function combineSelectedItems() {
        if (selectedSlots.length !== 2) {
          showMsg("조합할 아이템 2개를 선택해 주세요.");
          return;
        }
        let itemA = inventory[selectedSlots[0]];
        let itemB = inventory[selectedSlots[1]];

        if (
          (itemA.id === "HAMMER_HEAD" && itemB.id === "WOOD_HANDLE") ||
          (itemA.id === "WOOD_HANDLE" && itemB.id === "HAMMER_HEAD")
        ) {
          let first = Math.max(selectedSlots[0], selectedSlots[1]);
          let second = Math.min(selectedSlots[0], selectedSlots[1]);
          inventory.splice(first, 1);
          inventory.splice(second, 1);
          inventory.push(ITEMS.FULL_HAMMER);
          selectedSlots = [];
          updateInventoryUI();
          showMsg("⚙️ 조합 성공: [완성된 망치] 제작 완료!");
          playSound("item");
          return;
        }

        if (
          (itemA.id === "KEY_PART_A" && itemB.id === "KEY_PART_B") ||
          (itemA.id === "KEY_PART_B" && itemB.id === "KEY_PART_A")
        ) {
          let first = Math.max(selectedSlots[0], selectedSlots[1]);
          let second = Math.min(selectedSlots[0], selectedSlots[1]);
          inventory.splice(first, 1);
          inventory.splice(second, 1);
          inventory.push(ITEMS.MASTER_KEY);
          selectedSlots = [];
          updateInventoryUI();
          showMsg("🔑 조합 성공: [완성된 마스터키] 제작 완료!");
          playSound("item");
          return;
        }

        showMsg("조합할 수 없는 아이템입니다.");
        selectedSlots = [];
        updateInventoryUI();
      }

      function updateInventoryUI() {
        for (let i = 0; i < 4; i++) {
          let slot = document.getElementById(`slot-${i}`);
          slot.innerHTML = "";
          slot.className = "inv-slot";
          if (selectedSlots.includes(i)) slot.classList.add("selected");
          if (inventory[i]) {
            slot.innerHTML = inventory[i].icon;
            slot.classList.add("has-item");
          }
        }
      }

      function openSafeModal() {
        safeInput = "";
        document.getElementById("safe-display").innerText = "____";
        document.getElementById("safe-modal").style.display = "block";
      }
      function closeSafeModal() {
        document.getElementById("safe-modal").style.display = "none";
      }
      function pressSafeKey(num) {
        if (safeInput.length < 4) {
          safeInput += num;
          document.getElementById("safe-display").innerText = safeInput.padEnd(
            4,
            "_",
          );
          playSound("click");
        }
      }
      function clearSafeKey() {
        safeInput = "";
        document.getElementById("safe-display").innerText = "____";
        playSound("click");
      }
      function submitSafeKey() {
        if (safeInput === safePassword) {
          closeSafeModal();
          items["safe_cleared"] = true;
          inventory.push(ITEMS.KEY_PART_A);
          updateInventoryUI();
          showMsg("🔓 금고 해제! [마스터키 (상)] 조각 획득!");
          playSound("item");
        } else {
          playSound("jumpscare");
          showMsg("❌ 암호가 일치하지 않습니다.");
          clearSafeKey();
        }
      }

      function triggerJumpScareChance() {
        if (Math.random() < 0.25) {
          triggerJumpscare();
          battery = Math.max(0, battery - 10);
          showMsg("😱 섬뜩한 기운에 랜턴 배터리가 떨어졌습니다! (-10%)");
        }
      }

      function triggerJumpscare() {
        playSound("jumpscare");
        let flash = document.getElementById("jumpscare-flash");
        flash.style.opacity = "0.85";
        setTimeout(() => {
          flash.style.opacity = "0";
        }, 180);
      }

      let msgTimer = null;
      function showMsg(text) {
        let box = document.getElementById("message-box");
        box.innerText = text;
        box.style.display = "block";
        if (msgTimer) clearTimeout(msgTimer);
        msgTimer = setTimeout(() => {
          box.style.display = "none";
        }, 3200);
      }

      function clearGame() {
        gameState = "WIN";
        clearInterval(timerInterval);
        let finalTime = ((performance.now() - startTime) / 1000).toFixed(2);
        document.getElementById("final-time").innerText = finalTime + "초";
        document.getElementById("win-screen").classList.remove("hidden");
      }

      function resetGame() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById("safe-modal").style.display = "none";
        document.getElementById("win-screen").classList.add("hidden");
        document.getElementById("start-screen").classList.remove("hidden");
      }

      window.onload = () => {
        setupCanvas();
      };
      window.onresize = () => {
        resizeCanvas();
      };
    </script>
  </body>
</html>

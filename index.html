<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>할로윈 방탈출: 어둠 속의 랜턴 (Mobile & PC)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 터치 스크롤 방지 */
        }
        body {
            background-color: #030206;
            color: #e2e2e9;
            font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            height: 100vh;
            max-height: 680px;
            border: 2px solid #331c42;
            box-shadow: 0 0 40px rgba(110, 20, 160, 0.4);
            overflow: hidden;
            background: #000;
        }

        /* 으스스한 배경 연출 */
        .room-bg {
            position: absolute;
            width: 100%; height: 100%;
            background-image: radial-gradient(circle, rgba(15, 10, 25, 0.3) 0%, rgba(3, 2, 6, 0.95) 100%), 
                              url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: contrast(125%) brightness(75%);
        }

        /* 시각적 이모지 오브젝트 */
        .room-object {
            position: absolute;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.9));
            z-index: 2;
        }

        /* 16개 조사 포인트 (반응형 퍼센트 위치) */
        .inspect-point {
            position: absolute;
            border: 1px dashed rgba(255, 153, 0, 0.25);
            background: rgba(255, 153, 0, 0.05);
            border-radius: 6px;
            z-index: 5;
            transition: background 0.2s;
        }
        .inspect-point:active, .inspect-point:hover {
            background: rgba(255, 153, 0, 0.35);
            border-color: rgba(255, 215, 0, 0.9);
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.6);
        }

        #flashlight-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* UI 구성 레이어 */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }
        .top-bar, .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 8, 16, 0.92);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #4a2f60;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        .stat-group { display: flex; gap: 12px; font-size: 13px; font-weight: bold; align-items: center; }
        .battery-bar-container {
            width: 80px; height: 12px;
            background: #181520;
            border: 1px solid #5d3d75;
            border-radius: 3px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 4px;
        }
        #battery-fill { width: 100%; height: 100%; background: #4caf50; transition: width 0.3s; }

        .inventory-container { display: flex; align-items: center; gap: 6px; }
        .inventory { display: flex; gap: 6px; }
        .inv-slot {
            width: 44px; height: 44px;
            background: #14101d;
            border: 1px solid #48345c;
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; cursor: pointer; transition: all 0.2s;
        }
        .inv-slot.has-item { border-color: #ff9800; background: #2a1c0e; }
        .inv-slot.selected { border-color: #00e676; box-shadow: 0 0 10px rgba(0,230,118,0.7); background: #16301e; }

        /* 화면 팝업 모달 */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 3, 7, 0.96);
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding: 20px;
            touch-action: auto;
        }
        .screen h1 { font-size: 28px; color: #ff5722; margin-bottom: 12px; text-shadow: 0 0 12px rgba(255, 87, 34, 0.6); }
        .screen p { color: #b3b3c6; margin-bottom: 20px; line-height: 1.5; max-width: 500px; font-size: 14px; }
        .btn {
            background: #6a1b9a; color: white; border: none;
            padding: 10px 22px; font-size: 14px; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: all 0.2s;
            touch-action: manipulation;
        }
        .btn:active { background: #8e24aa; transform: scale(0.98); }

        /* 금고 모달 (모바일 최적화) */
        #safe-modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 290px; background: #120e1a;
            border: 2px solid #ff5722; border-radius: 8px;
            padding: 16px; z-index: 80; display: none; text-align: center;
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
            touch-action: manipulation;
        }
        #safe-display {
            width: 100%; height: 40px; background: #000;
            border: 1px solid #54396d; color: #ff5722;
            font-size: 24px; letter-spacing: 6px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 12px; font-family: monospace;
        }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .keypad button {
            padding: 14px; background: #20192e; color: white;
            border: 1px solid #48345c; font-size: 18px; font-weight: bold;
            border-radius: 6px; cursor: pointer;
        }
        .keypad button:active { background: #382a50; }

        #message-box {
            position: absolute; bottom: 75px; left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 8, 16, 0.95);
            border: 1px solid #ff9800; color: #ffe0b2;
            padding: 10px 18px; border-radius: 6px; font-size: 13px;
            z-index: 25; display: none; pointer-events: none;
            width: 90%; max-width: 500px; text-align: center;
        }

        #jumpscare-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #8b0000; z-index: 50; opacity: 0; pointer-events: none;
            transition: opacity 0.1s;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="room-bg"></div>

    <!-- 방 분위기 오브젝트 (상대 비율 % 위치) -->
    <div class="room-object" style="top: 5%; left: 39%; font-size: 40px;">🖼️</div>
    <div class="room-object" style="top: 6%; right: 10%; font-size: 50px;">🕰️</div>
    <div class="room-object" style="top: 7%; left: 6%; font-size: 65px;">📚</div>
    <div class="room-object" style="bottom: 8%; left: 8%; font-size: 75px;">🛏️</div>
    <div class="room-object" style="bottom: 9%; right: 7%; font-size: 65px;">🗄️</div>
    <div class="room-object" style="bottom: 20%; left: 45%; font-size: 90px;">🚪</div>
    <div class="room-object" style="top: 32%; right: 26%; font-size: 30px;">🔲</div>
    <div class="room-object" style="top: 26%; left: 24%; font-size: 26px;">💀</div>
    <div class="room-object" style="top: 5%; left: 22%; font-size: 25px;">🌀</div>
    <div class="room-object" style="bottom: 42%; left: 8%; font-size: 32px;">🪑</div>
    <div class="room-object" style="top: 46%; right: 9%; font-size: 28px;">📦</div>
    <div class="room-object" style="bottom: 3%; right: 28%; font-size: 22px;">👟</div>
    <div class="room-object" style="top: 23%; right: 39%; font-size: 24px;">🕯️</div>

    <!-- 16개 조사 인터랙션 포인트 -->
    <div class="inspect-point" style="top: 5%; left: 38%; width: 8%; height: 12%;" onclick="inspectPoint('painting')"></div>
    <div class="inspect-point" style="top: 6%; right: 9%; width: 9%; height: 18%;" onclick="inspectPoint('clock')"></div>
    <div class="inspect-point" style="top: 6%; left: 5%; width: 11%; height: 26%;" onclick="inspectPoint('bookshelf')"></div>
    <div class="inspect-point" style="bottom: 8%; left: 7%; width: 25%; height: 15%;" onclick="inspectPoint('bed')"></div>
    <div class="inspect-point" style="bottom: 9%; right: 6%; width: 12%; height: 18%;" onclick="inspectPoint('desk')"></div>
    <div class="inspect-point" style="bottom: 20%; left: 44%; width: 10%; height: 22%;" onclick="inspectPoint('door')"></div>
    <div class="inspect-point" style="top: 31%; right: 25%; width: 7%; height: 9%;" onclick="inspectPoint('safe')"></div>
    <div class="inspect-point" style="top: 25%; left: 23%; width: 6%; height: 8%;" onclick="inspectPoint('skull')"></div>
    <div class="inspect-point" style="top: 25%; left: 42%; width: 13%; height: 12%;" onclick="inspectPoint('wall')"></div>
    <div class="inspect-point" style="bottom: 2%; left: 40%; width: 18%; height: 8%;" onclick="inspectPoint('carpet')"></div>
    <div class="inspect-point" style="bottom: 31%; right: 18%; width: 7%; height: 9%;" onclick="inspectPoint('mirror')"></div>
    <div class="inspect-point" style="top: 5%; left: 21%; width: 7%; height: 9%;" onclick="inspectPoint('vent')"></div>
    <div class="inspect-point" style="bottom: 41%; left: 7%; width: 8%; height: 11%;" onclick="inspectPoint('chair')"></div>
    <div class="inspect-point" style="top: 45%; right: 8%; width: 9%; height: 10%;" onclick="inspectPoint('box')"></div>
    <div class="inspect-point" style="bottom: 2%; right: 27%; width: 8%; height: 8%;" onclick="inspectPoint('shoes')"></div>
    <div class="inspect-point" style="top: 22%; right: 38%; width: 6%; height: 8%;" onclick="inspectPoint('candle')"></div>

    <canvas id="flashlight-canvas"></canvas>
    <div id="jumpscare-flash"></div>

    <!-- 금고 모달 -->
    <div id="safe-modal">
        <h3 style="color:#ff5722; margin-bottom:8px; font-size: 16px;">🔒 암호 입력</h3>
        <div id="safe-display">____</div>
        <div class="keypad">
            <button onclick="pressSafeKey('1')">1</button><button onclick="pressSafeKey('2')">2</button><button onclick="pressSafeKey('3')">3</button>
            <button onclick="pressSafeKey('4')">4</button><button onclick="pressSafeKey('5')">5</button><button onclick="pressSafeKey('6')">6</button>
            <button onclick="pressSafeKey('7')">7</button><button onclick="pressSafeKey('8')">8</button><button onclick="pressSafeKey('9')">9</button>
            <button onclick="clearSafeKey()" style="color:#f44336;">C</button>
            <button onclick="pressSafeKey('0')">0</button>
            <button onclick="submitSafeKey()" style="color:#4caf50;">OK</button>
        </div>
        <button class="btn" style="margin-top:10px; padding:5px 12px; font-size:12px;" onclick="closeSafeModal()">닫기</button>
    </div>

    <div id="message-box"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="stat-group">
                <span>⏱️ <span id="timer-display">00.00초</span></span>
                <span>🔦 <div class="battery-bar-container"><div id="battery-fill"></div></div></span>
                <span id="uv-status" style="color:#a855f7; display:none; font-size:11px;">💜 UV ON</span>
            </div>
            <button class="btn" style="padding: 4px 10px; font-size: 12px;" onclick="resetGame()">재시작</button>
        </div>
        <div class="bottom-bar">
            <div class="inventory-container">
                <div class="inventory">
                    <div class="inv-slot" id="slot-0" onclick="clickSlot(0)"></div>
                    <div class="inv-slot" id="slot-1" onclick="clickSlot(1)"></div>
                    <div class="inv-slot" id="slot-2" onclick="clickSlot(2)"></div>
                    <div class="inv-slot" id="slot-3" onclick="clickSlot(3)"></div>
                </div>
            </div>
            <button class="btn" style="padding: 6px 10px; font-size: 11px; background:#e65100;" onclick="combineSelectedItems()">조합하기</button>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>🎃 어둠 속의 랜턴 🎃</h1>
        <p>화면을 터치하거나 문질러 랜턴 빛을 밝히세요.<br>1

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할로윈 방탈출: 어둠 속의 랜턴 (Dramatic UV Edition)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
        }
        body {
            background-color: #030206;
            color: #e2e2e9;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 960px;
            height: 680px;
            border: 4px solid #331c42;
            box-shadow: 0 0 50px rgba(110, 20, 160, 0.4);
            overflow: hidden;
            cursor: crosshair;
            background: #000;
        }

        /* 으스스한 일러스트 연출 배경 및 조명 효과 */
        .room-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(15, 10, 25, 0.3) 0%, rgba(3, 2, 6, 0.95) 100%), 
                              url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=1200&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            filter: contrast(125%) brightness(75%);
        }

        /* 시각적 이모지 오브젝트 레이어 */
        .room-object {
            position: absolute;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.9));
            z-index: 2;
        }

        /* 16개 넓게 배치된 조사 포인트 */
        .inspect-point {
            position: absolute;
            border: 1px dashed rgba(255, 153, 0, 0.25);
            background: rgba(255, 153, 0, 0.04);
            border-radius: 4px;
            transition: all 0.2s ease;
            z-index: 5;
        }
        .inspect-point:hover {
            background: rgba(255, 153, 0, 0.3);
            border-color: rgba(255, 215, 0, 0.9);
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
        }

        #flashlight-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* UI 구성 요소 */
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .top-bar, .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 8, 16, 0.92);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #4a2f60;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        .stat-group { display: flex; gap: 20px; font-size: 14px; font-weight: bold; }
        .battery-bar-container {
            width: 110px; height: 14px;
            background: #181520;
            border: 1px solid #5d3d75;
            border-radius: 3px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 6px;
        }
        #battery-fill { width: 100%; height: 100%; background: #4caf50; transition: width 0.3s; }

        .inventory-container { display: flex; align-items: center; gap: 10px; }
        .inventory { display: flex; gap: 8px; }
        .inv-slot {
            width: 46px; height: 46px;
            background: #14101d;
            border: 1px solid #48345c;
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            font-size: 22px; cursor: pointer; transition: all 0.2s;
        }
        .inv-slot.has-item { border-color: #ff9800; background: #2a1c0e; }
        .inv-slot.selected { border-color: #00e676; box-shadow: 0 0 12px rgba(0,230,118,0.7); background: #16301e; }

        /* 화면 팝업 모달 */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 3, 7, 0.95);
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; padding: 30px;
        }
        .screen h1 { font-size: 38px; color: #ff5722; margin-bottom: 15px; text-shadow: 0 0 15px rgba(255, 87, 34, 0.6); }
        .screen p { color: #b3b3c6; margin-bottom: 25px; line-height: 1.6; max-width: 600px; }
        .btn {
            background: #6a1b9a; color: white; border: none;
            padding: 12px 28px; font-size: 15px; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { background: #8e24aa; transform: translateY(-2px); }

        /* 금고 모달 */
        #safe-modal {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px; background: #120e1a;
            border: 2px solid #ff5722; border-radius: 8px;
            padding: 20px; z-index: 80; display: none; text-align: center;
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
        }
        #safe-display {
            width: 100%; height: 45px; background: #000;
            border: 1px solid #54396d; color: #ff5722;
            font-size: 26px; letter-spacing: 8px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 15px; font-family: monospace;
        }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .keypad button {
            padding: 12px; background: #20192e; color: white;
            border: 1px solid #48345c; font-size: 16px; font-weight: bold;
            border-radius: 4px; cursor: pointer;
        }

        #message-box {
            position: absolute; bottom: 85px; left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 8, 16, 0.95);
            border: 1px solid #ff9800; color: #ffe0b2;
            padding: 12px 24px; border-radius: 6px; font-size: 14px;
            z-index: 25; display: none; pointer-events: none;
            max-width: 600px; text-align: center;
        }

        #jumpscare-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #8b0000; z-index: 50; opacity: 0; pointer-events: none;
            transition: opacity 0.1s;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="room-bg"></div>

    <!-- 방 안 분위기 그래픽 오브젝트 -->
    <div class="room-object" style="top: 35px; left: 380px; font-size: 50px;">🖼️</div>
    <div class="room-object" style="top: 45px; right: 100px; font-size: 65px;">🕰️</div>
    <div class="room-object" style="top: 50px; left: 60px; font-size: 85px;">📚</div>
    <div class="room-object" style="bottom: 60px; left: 80px; font-size: 95px;">🛏️</div>
    <div class="room-object" style="bottom: 70px; right: 70px; font-size: 85px;">🗄️</div>
    <div class="room-object" style="bottom: 140px; left: 440px; font-size: 115px;">🚪</div>
    <div class="room-object" style="top: 220px; right: 260px; font-size: 38px;">🔲</div>
    <div class="room-object" style="top: 180px; left: 240px; font-size: 32px;">💀</div>
    <div class="room-object" style="top: 40px; left: 220px; font-size: 30px;">🌀</div>
    <div class="room-object" style="bottom: 300px; left: 80px; font-size: 40px;">🪑</div>
    <div class="room-object" style="top: 320px; right: 90px; font-size: 35px;">📦</div>
    <div class="room-object" style="bottom: 20px; right: 280px; font-size: 25px;">👟</div>
    <div class="room-object" style="top: 160px; right: 380px; font-size: 28px;">🕯️</div>

    <!-- 16개 조사 가능 포인트 -->
    <div class="inspect-point" style="top: 35px; left: 375px; width: 75px; height: 85px;" onclick="inspectPoint('painting')" title="초상화 액자"></div>
    <div class="inspect-point" style="top: 45px; right: 95px; width: 85px; height: 125px;" onclick="inspectPoint('clock')" title="쾌종시계"></div>
    <div class="inspect-point" style="top: 45px; left: 55px; width: 105px; height: 185px;" onclick="inspectPoint('bookshelf')" title="책장"></div>
    <div class="inspect-point" style="bottom: 55px; left: 75px; width: 235px; height: 95px;" onclick="inspectPoint('bed')" title="침대 밑"></div>
    <div class="inspect-point" style="bottom: 65px; right: 65px; width: 115px; height: 125px;" onclick="inspectPoint('desk')" title="서랍장"></div>
    <div class="inspect-point" style="bottom: 140px; left: 435px; width: 85px; height: 155px;" onclick="inspectPoint('door')" title="철제 현관문"></div>
    <div class="inspect-point" style="top: 215px; right: 255px; width: 60px; height: 60px;" onclick="inspectPoint('safe')" title="전자 금고"></div>
    <div class="inspect-point" style="top: 175px; left: 235px; width: 55px; height: 55px;" onclick="inspectPoint('skull')" title="선반 위 해골"></div>
    <div class="inspect-point" style="top: 175px; left: 415px; width: 125px; height: 85px;" onclick="inspectPoint('wall')" title="핏자국 벽면"></div>
    <div class="inspect-point" style="bottom: 15px; left: 395px; width: 165px; height: 55px;" onclick="inspectPoint('carpet')" title="낡은 카펫"></div>
    <div class="inspect-point" style="bottom: 215px; right: 175px; width: 65px; height: 65px;" onclick="inspectPoint('mirror')" title="깨진 거울"></div>
    <div class="inspect-point" style="top: 35px; left: 215px; width: 65px; height: 65px;" onclick="inspectPoint('vent')" title="환기구"></div>
    <div class="inspect-point" style="bottom: 295px; left: 75px; width: 75px; height: 75px;" onclick="inspectPoint('chair')" title="낡은 의자"></div>
    <div class="inspect-point" style="top: 315px; right: 85px; width: 85px; height: 65px;" onclick="inspectPoint('box')" title="목재 상자"></div>
    <div class="inspect-point" style="bottom: 15px; right: 275px; width: 75px; height: 55px;" onclick="inspectPoint('shoes')" title="구석진 헌 신발"></div>
    <div class="inspect-point" style="top: 155px; right: 375px; width: 55px; height: 55px;" onclick="inspectPoint('candle')" title="촛대"></div>

    <canvas id="flashlight-canvas"></canvas>
    <div id="jumpscare-flash"></div>

    <!-- 금고 모달 -->
    <div id="safe-modal">
        <h3 style="color:#ff5722; margin-bottom:10px;">🔒 암호 입력</h3>
        <div id="safe-display">____</div>
        <div class="keypad">
            <button onclick="pressSafeKey('1')">1</button><button onclick="pressSafeKey('2')">2</button><button onclick="pressSafeKey('3')">3</button>
            <button onclick="pressSafeKey('4')">4</button><button onclick="pressSafeKey('5')">5</button><button onclick="pressSafeKey('6')">6</button>
            <button onclick="pressSafeKey('7')">7</button><button onclick="pressSafeKey('8')">8</button><button onclick="pressSafeKey('9')">9</button>
            <button onclick="clearSafeKey()" style="color:#f44336;">C</button>
            <button onclick="pressSafeKey('0')">0</button>
            <button onclick="submitSafeKey()" style="color:#4caf50;">OK</button>
        </div>
        <button class="btn" style="margin-top:12px; padding:6px 15px; font-size:12px;" onclick="closeSafeModal()">닫기</button>
    </div>

    <div id="message-box"></div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="stat-group">
                <span>⏱️ <span id="timer-display">00.00초</span></span>
                <span>🔦 랜턴: <div class="battery-bar-container"><div id="battery-fill"></div></div></span>
                <span id="uv-status" style="color:#a855f7; display:none;">💜 UV 라이트 ON</span>
            </div>
            <button class="btn" style="padding: 6px 14px; font-size: 13px;" onclick="resetGame()">재시작</button>
        </div>
        <div class="bottom-bar">
            <div class="inventory-container">
                <span style="font-size: 13px; color: #aaa; margin-right:5px;">소지품:</span>
                <div class="inventory">
                    <div class="inv-slot" id="slot-0" onclick="clickSlot(0)"></div>
                    <div class="inv-slot" id="slot-1" onclick="clickSlot(1)"></div>
                    <div class="inv-slot" id="slot-2" onclick="clickSlot(2)"></div>
                    <div class="inv-slot" id="slot-3" onclick="clickSlot(3)"></div>
                </div>
            </div>
            <button class="btn" style="padding: 6px 12px; font-size: 12px; background:#e65100;" onclick="combineSelectedItems()">아이템 조합</button>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>🎃 어둠 속의 랜턴 (Dramatic Edition) 🎃</h1>
        <p>16개의 장소 중 무작위 위치에 핵심 아이템들이 숨겨져 있습니다.<br>UV 필터를 키고 중앙 핏자국 벽면 근처를 비추면 보랏빛 속에 형광 네온 암호가 떠오릅니다!</p>
        <button class="btn" onclick="startGame()">게임 시작</button>
    </div>

    <div id="win-screen" class="screen hidden">
        <h1>🎉 완전한 탈출 성공! 🎉</h1>
        <p>클리어 시간: <span id="final-time" style="color: #ff9800; font-weight: bold; font-size: 22px;">00.00초</span></p>
        <button class="btn" onclick="resetGame()">다시 하기</button>
    </div>
</div>

<script>
    let gameState = 'START';
    let startTime = 0;
    let timerInterval = null;
    let battery = 100;
    let inventory = [];
    let selectedSlots = [];
    let items = {};
    let safePassword = "0000";
    let safeInput = "";
    let isUvActive = false;
    let isDrawerUnlocked = false;
    let isClockFixed = false;
    let mouseX = 480, mouseY = 340;
    let canvas, ctx;

    const ITEMS = {
        BATTERY: { id: 'BATTERY', name: '건전지', icon: '🔋', desc: '클릭 시 랜턴 배터리 +40% 충전' },
        RUSTY_KEY: { id: 'RUSTY_KEY', name: '녹슨 열쇠', icon: '🗝️', desc: '낡은 서랍장을 열 수 있는 열쇠' },
        HAMMER_HEAD: { id: 'HAMMER_HEAD', name: '망치 머리', icon: '🔨', desc: '손잡이가 없는 묵직한 망치 머리' },
        WOOD_HANDLE: { id: 'WOOD_HANDLE', name: '나무 자루', icon: '🪵', desc: '망치 머리와 결합할 수 있는 자루' },
        FULL_HAMMER: { id: 'FULL_HAMMER', name: '완성된 망치', icon: '⚒️', desc: '단단한 물체를 부술 수 있는 망치' },
        UV_FILTER: { id: 'UV_FILTER', name: 'UV 필터', icon: '💜', desc: '클릭하여 랜턴에 장착/해제 (벽면에서 자외선 암호 확인)' },
        CLOCK_HAND: { id: 'CLOCK_HAND', name: '시계 바늘', icon: '🧭', desc: '멈춰버린 쾌종시계에 장착할 바늘' },
        KEY_PART_A: { id: 'KEY_PART_A', name: '마스터키 (상)', icon: '🧩', desc: '파손된 메인 키의 상단 조각' },
        KEY_PART_B: { id: 'KEY_PART_B', name: '마스터키 (하)', icon: '🧩', desc: '파손된 메인 키의 하단 조각' },
        MASTER_KEY: { id: 'MASTER_KEY', name: '완성된 마스터키', icon: '🚪', desc: '철제 현관문을 열 수 있는 완전한 키' }
    };

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playSound(type) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'click') {
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'item') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.exponentialRampToValueAtTime(750, now + 0.2);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'jumpscare') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(650, now + 0.35);
            gain.gain.setValueAtTime(0.65, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
            osc.start(now); osc.stop(now + 0.35);
        }
    }

    const container = document.getElementById('game-container');
    container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    });

    function setupCanvas() {
        canvas = document.getElementById('flashlight-canvas');
        ctx = canvas.getContext('2d');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        requestAnimationFrame(updateFlashlight);
    }

    function updateFlashlight() {
        if (gameState === 'PLAYING') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(3, 2, 6, 0.96)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let radius = 70 + (battery / 100) * 60;
            ctx.globalCompositeOperation = 'destination-out';
            
            let gradient = ctx.createRadialGradient(mouseX, mouseY, radius * 0.15, mouseX, mouseY, radius);
            gradient.addColorStop(0, 'rgba(0, 0, 0, 1)');
            gradient.addColorStop(0.75, 'rgba(0, 0, 0, 0.85)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalCompositeOperation = 'source-over';

            // ★ UV 필터 오버레이 + 핏자국 벽면 네온 텍스트 렌더링 ★
            if (isUvActive) {
                ctx.fillStyle = 'rgba(168, 85, 247, 0.25)';
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, radius, 0, Math.PI * 2);
                ctx.fill();

                // 마우스 랜턴이 핏자국 벽면 (x: 380~580, y: 150~280) 영역을 비추고 있을 때 네온 암호 텍스트 출력
                if (mouseX >= 380 && mouseX <= 580 && mouseY >= 150 && mouseY <= 280) {
                    ctx.font = 'bold 36px monospace';
                    ctx.fillStyle = '#00ff66';
                    ctx.shadowColor = '#00ff66';
                    ctx.shadowBlur = 18;
                    ctx.fillText(safePassword, 435, 225);
                    ctx.shadowBlur = 0; // 초기화
                }
            }

            battery -= 0.035;
            if (battery <= 0) {
                battery = 0;
                triggerJumpscare();
                showMsg("배터리가 끊겨 어둠 속에서 소멸했습니다...");
                resetGame();
            }
            
            document.getElementById('battery-fill').style.width = battery + '%';
            document.getElementById('battery-fill').style.background = battery < 30 ? '#f44336' : '#4caf50';
        }
        requestAnimationFrame(updateFlashlight);
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('win-screen').classList.add('hidden');
        
        gameState = 'PLAYING';
        battery = 100;
        inventory = [];
        selectedSlots = [];
        isUvActive = false;
        isDrawerUnlocked = false;
        isClockFixed = false;
        document.getElementById('uv-status').style.display = 'none';
        updateInventoryUI();

        safePassword = Math.floor(1000 + Math.random() * 9000).toString();

        startTime = performance.now();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            let elapsed = ((performance.now() - startTime) / 1000).toFixed(2);
            document.getElementById('timer-display').innerText = elapsed + '초';
        }, 50);

        // 16개 장소 중 무작위 핵심 아이템 배치
        const allPoints = ['painting', 'bookshelf', 'bed', 'carpet', 'mirror', 'vent', 'chair', 'box', 'shoes', 'candle'];
        let shuffled = allPoints.sort(() => 0.5 - Math.random());

        items = {
            [shuffled[0]]: ITEMS.RUSTY_KEY,
            [shuffled[1]]: ITEMS.WOOD_HANDLE,
            [shuffled[2]]: ITEMS.CLOCK_HAND,
            [shuffled[3]]: ITEMS.BATTERY,
            [shuffled[4]]: ITEMS.BATTERY
        };
    }

    function inspectPoint(pointId) {
        if (gameState !== 'PLAYING') return;
        playSound('click');

        if (pointId === 'desk') {
            if (!isDrawerUnlocked) {
                let keyIdx = inventory.findIndex(item => item.id === 'RUSTY_KEY');
                if (keyIdx !== -1) {
                    isDrawerUnlocked = true;
                    inventory.splice(keyIdx, 1);
                    inventory.push(ITEMS.HAMMER_HEAD);
                    updateInventoryUI();
                    showMsg("🔑 녹슨 열쇠로 서랍을 열었습니다! [망치 머리]를 획득했습니다.");
                    playSound('item');
                } else {
                    showMsg("서랍장이 잠겨있습니다. 녹슨 열쇠가 필요합니다.");
                }
            } else { showMsg("서랍장은 비어있습니다."); }
            return;
        }

        if (pointId === 'skull') {
            let hammerIdx = inventory.findIndex(item => item.id === 'FULL_HAMMER');
            if (hammerIdx !== -1) {
                if (items['skull'] !== null) {
                    items['skull'] = null;
                    inventory.push(ITEMS.UV_FILTER);
                    inventory.push(ITEMS.BATTERY);
                    updateInventoryUI();
                    showMsg("💥 망치로 해골을 깨부쉈습니다! [UV 필터]와 [건전지]를 얻었습니다.");
                    playSound('item');
                } else { showMsg("깨진 해골 조각들만 남아있습니다."); }
            } else { showMsg("단단한 해골 소품입니다. 망치 같은 도구가 필요합니다."); }
            return;
        }

        if (pointId === 'wall') {
            if (isUvActive) {
                showMsg(`💜 UV 보랏빛 속에서 형광 암호가 선명하게 밝혀집니다: [ ${safePassword} ]`);
            } else {
                showMsg("벽면에 얼룩진 핏자국이 있습니다. 자외선(UV) 빛으로 비춰봐야 할 것 같습니다.");
            }
            return;
        }

        if (pointId === 'clock') {
            if (!isClockFixed) {
                let handIdx = inventory.findIndex(item => item.id === 'CLOCK_HAND');
                if (handIdx !== -1) {
                    isClockFixed = true;
                    inventory.splice(handIdx, 1);
                    inventory.push(ITEMS.KEY_PART_B);
                    updateInventoryUI();
                    showMsg("🕰️ 시계 바늘을 장착하자 밑바닥 비밀함에서 [마스터키 (하)] 조각이 떨어졌습니다!");
                    playSound('item');
                } else { showMsg("시계 바늘이 빠져서 멈춰있습니다. 바늘을 찾아야 합니다."); }
            } else { showMsg("시계가 정상 작동 중입니다."); }
            return;
        }

        if (pointId === 'safe') {
            if (items['safe_cleared']) showMsg("전자 금고는 열려있습니다.");
            else openSafeModal();
            return;
        }

        if (pointId === 'door') {
            let masterKeyIdx = inventory.findIndex(item => item.id === 'MASTER_KEY');
            if (masterKeyIdx !== -1) clearGame();
            else showMsg("🔒 육중한 현관문입니다. [완성된 마스터키]가 필요합니다.");
            return;
        }

        let found = items[pointId];
        if (found) {
            if (inventory.length < 4) {
                inventory.push(found);
                items[pointId] = null;
                updateInventoryUI();
                showMsg(`조사 성공: [${found.name}]을(를) 획득했습니다!`);
                playSound('item');
            } else showMsg("소지품 칸이 가득 찼습니다!");
        } else {
            showMsg("아무것도 없습니다...");
            triggerJumpScareChance();
        }
    }

    function clickSlot(idx) {
        let item = inventory[idx];
        if (!item) return;

        if (item.id === 'BATTERY') {
            battery = Math.min(100, battery + 40);
            inventory.splice(idx, 1);
            updateInventoryUI();
            showMsg("🔋 건전지로 랜턴을 충전했습니다 (+40%)");
            playSound('item');
            return;
        }

        if (item.id === 'UV_FILTER') {
            isUvActive = !isUvActive;
            document.getElementById('uv-status').style.display = isUvActive ? 'inline' : 'none';
            showMsg(isUvActive ? "💜 UV 필터를 장착했습니다! (벽면을 비춰보세요)" : "💡 일반 랜턴 모드로 전환합니다.");
            playSound('click');
            return;
        }

        let selIndex = selectedSlots.indexOf(idx);
        if (selIndex !== -1) selectedSlots.splice(selIndex, 1);
        else if (selectedSlots.length < 2) selectedSlots.push(idx);
        updateInventoryUI();
    }

    function combineSelectedItems() {
        if (selectedSlots.length !== 2) {
            showMsg("조합할 아이템 2개를 선택해 주세요.");
            return;
        }
        let itemA = inventory[selectedSlots[0]];
        let itemB = inventory[selectedSlots[1]];

        if ((itemA.id === 'HAMMER_HEAD' && itemB.id === 'WOOD_HANDLE') ||
            (itemA.id === 'WOOD_HANDLE' && itemB.id === 'HAMMER_HEAD')) {
            
            let first = Math.max(selectedSlots[0], selectedSlots[1]);
            let second = Math.min(selectedSlots[0], selectedSlots[1]);
            inventory.splice(first, 1); inventory.splice(second, 1);
            inventory.push(ITEMS.FULL_HAMMER);
            selectedSlots = [];
            updateInventoryUI();
            showMsg("⚙️ 조합 성공: [완성된 망치] 제작 완료!");
            playSound('item');
            return;
        }

        if ((itemA.id === 'KEY_PART_A' && itemB.id === 'KEY_PART_B') ||
            (itemA.id === 'KEY_PART_B' && itemB.id === 'KEY_PART_A')) {
            
            let first = Math.max(selectedSlots[0], selectedSlots[1]);
            let second = Math.min(selectedSlots[0], selectedSlots[1]);
            inventory.splice(first, 1); inventory.splice(second, 1);
            inventory.push(ITEMS.MASTER_KEY);
            selectedSlots = [];
            updateInventoryUI();
            showMsg("🔑 조합 성공: [완성된 마스터키] 제작 완료!");
            playSound('item');
            return;
        }

        showMsg("조합할 수 없는 아이템입니다.");
        selectedSlots = [];
        updateInventoryUI();
    }

    function updateInventoryUI() {
        for (let i = 0; i < 4; i++) {
            let slot = document.getElementById(`slot-${i}`);
            slot.innerHTML = ''; slot.className = 'inv-slot';
            if (selectedSlots.includes(i)) slot.classList.add('selected');
            if (inventory[i]) {
                slot.innerHTML = inventory[i].icon;
                slot.title = `${inventory[i].name}\n(${inventory[i].desc})`;
                slot.classList.add('has-item');
            }
        }
    }

    function openSafeModal() {
        safeInput = "";
        document.getElementById('safe-display').innerText = "____";
        document.getElementById('safe-modal').style.display = 'block';
    }
    function closeSafeModal() { document.getElementById('safe-modal').style.display = 'none'; }
    function pressSafeKey(num) {
        if (safeInput.length < 4) {
            safeInput += num;
            document.getElementById('safe-display').innerText = safeInput.padEnd(4, '_');
            playSound('click');
        }
    }
    function clearSafeKey() {
        safeInput = "";
        document.getElementById('safe-display').innerText = "____";
        playSound('click');
    }
    function submitSafeKey() {
        if (safeInput === safePassword) {
            closeSafeModal();
            items['safe_cleared'] = true;
            inventory.push(ITEMS.KEY_PART_A);
            updateInventoryUI();
            showMsg("🔓 금고 해제 완료! [마스터키 (상)] 조각을 획득했습니다.");
            playSound('item');
        } else {
            playSound('jumpscare');
            showMsg("❌ 암호가 틀렸습니다.");
            clearSafeKey();
        }
    }

    function triggerJumpScareChance() {
        if (Math.random() < 0.25) {
            triggerJumpscare();
            battery = Math.max(0, battery - 10);
            showMsg("😱 으악! 섬뜩한 영가가 스쳐 지나가며 배터리가 떨어졌습니다! (-10%)");
        }
    }

    function triggerJumpscare() {
        playSound('jumpscare');
        let flash = document.getElementById('jumpscare-flash');
        flash.style.opacity = '0.85';
        setTimeout(() => { flash.style.opacity = '0'; }, 180);
    }

    let msgTimer = null;
    function showMsg(text) {
        let box = document.getElementById('message-box');
        box.innerText = text;
        box.style.display = 'block';
        if (msgTimer) clearTimeout(msgTimer);
        msgTimer = setTimeout(() => { box.style.display = 'none'; }, 3500);
    }

    function clearGame() {
        gameState = 'WIN';
        clearInterval(timerInterval);
        let finalTime = ((performance.now() - startTime) / 1000).toFixed(2);
        document.getElementById('final-time').innerText = finalTime + '초';
        document.getElementById('win-screen').classList.remove('hidden');
    }

    function resetGame() {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('safe-modal').style.display = 'none';
        document.getElementById('win-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    window.onload = () => { setupCanvas(); };
</script>

</body>
</html>
